services:
  mysql:
    image: mysql:8.0
    container_name: mysql-banktech
    ports:
      - "3307:3306"
    environment:
      MYSQL_USER: admin
      MYSQL_PASSWORD: 12345678
      MYSQL_DATABASE: banktech
      MYSQL_ROOT_PASSWORD: 12345678
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
